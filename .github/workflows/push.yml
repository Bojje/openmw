name: Build and test

on:
- push
- pull_request

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  Ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Add OpenMW PPA Dependencies
      run: sudo add-apt-repository ppa:openmw/openmw; sudo apt-get update

    - name: Install Building Dependencies
      run: sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic

    - name: Prime ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ matrix.os }}-${{ env.BUILD_TYPE }}
        max-size: 1000M

    - name: Configure
      run: >
        cmake .
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=ON
        -D USE_SYSTEM_TINYXML=ON
        -D BUILD_COMPONENTS_TESTS=ON
        -D BUILD_OPENMW_TESTS=ON
        -D BUILD_OPENCS_TESTS=ON
        -D CMAKE_INSTALL_PREFIX=install

    - name: Build
      run: cmake --build . -- -j$(nproc)

    - name: Run components tests
      run: ./components-tests

    - name: Run OpenMW tests
      run: ./openmw-tests

    - name: Run OpenMW-CS tests
      run: ./openmw-cs-tests

    # - name: Install
    #   shell: bash
    #   run: cmake --install .

    # - name: Create Artifact
    #   shell: bash
    #   working-directory: install
    #   run: |
    #     ls -laR
    #     7z a ../build_artifact.7z .

    # - name: Upload Artifact
    #   uses: actions/upload-artifact@v1
    #   with:
    #     path: ./build_artifact.7z
    #     name: build_artifact.7z

  Vulkan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Add OpenMW PPA Dependencies
      run: sudo add-apt-repository ppa:openmw/openmw; sudo apt-get update

    - name: Install Building and Vulkan Dependencies
      run: >
        sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic
        && sudo apt-get install -y binutils libvulkan-dev glslang-tools mesa-vulkan-drivers
        vulkan-validationlayers xvfb

    - name: Configure Vulkan migration build
      run: >
        cmake -S . -B build-vulkan
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=ON
        -D USE_SYSTEM_TINYXML=ON
        -D OPENMW_USE_VULKAN=ON
        -D BUILD_VULKAN_TESTS=ON

    - name: Build Vulkan migration targets
      run: cmake --build build-vulkan --target openmw openmw-vulkan-smoke openmw-vulkan-math-tests openmw-render-world-tests openmw-render-mesh-tests openmw-vulkan-image-tests openmw-vulkan-terrain-tests -- -j$(nproc)

    - name: Verify renderer link isolation
      run: |
        if readelf -d build-vulkan/openmw | grep -Eiq 'libvulkan|libOpenSceneGraph|libosg'; then
          echo "openmw must not carry Vulkan or OSG runtime dependencies in the isolated build"
          exit 1
        fi
        if ! readelf -d build-vulkan/openmw-vulkan-smoke | grep -q 'libvulkan'; then
          echo "openmw-vulkan-smoke must carry the Vulkan runtime dependency"
          exit 1
        fi
        if readelf -d build-vulkan/openmw-vulkan-smoke | grep -Eiq 'libOpenSceneGraph|libosg'; then
          echo "openmw-vulkan-smoke must not carry OSG runtime dependencies"
          exit 1
        fi
        if nm -C build-vulkan/openmw-vulkan-smoke | grep -Eiq 'osgViewer::|osgAnimation::|osgParticle::|osgShadow::|osgDB::|osgUtil::|osgGA::|osgSim::|osgText::'; then
          echo "openmw-vulkan-smoke must not contain OSG renderer implementation symbols"
          exit 1
        fi

    - name: Run Vulkan CPU and neutral tests
      run: >
        xvfb-run -a
        ctest --test-dir build-vulkan --output-on-failure
        -R 'openmw-(vulkan-(math-tests|image-tests|terrain-tests)|render-(world|mesh)-tests)'

    - name: Run Vulkan presentation smoke
      run: >
        xvfb-run -a
        env SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1
        ./build-vulkan/openmw-vulkan-smoke
        ./build-vulkan/resources/shaders/vulkan 3

  MacOS:
    strategy:
      fail-fast: true
      matrix:
        args:
          - image: macos-15
          - image: macos-15-intel
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.args.image }}

  Windows:
    strategy:
      fail-fast: true
      matrix:
        image:
        - "2022"

    uses: ./.github/workflows/windows.yml
    with:
      image: ${{ matrix.image }}
