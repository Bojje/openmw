name: Build and test

on:
- push
- pull_request

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  Ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Add OpenMW PPA Dependencies
      run: sudo add-apt-repository ppa:openmw/openmw; sudo apt-get update

    - name: Install Building Dependencies
      run: sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic

    - name: Prime ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ matrix.os }}-${{ env.BUILD_TYPE }}
        max-size: 1000M

    - name: Configure
      run: >
        cmake .
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=ON
        -D USE_SYSTEM_TINYXML=ON
        -D BUILD_COMPONENTS_TESTS=ON
        -D BUILD_OPENMW_TESTS=ON
        -D BUILD_OPENCS_TESTS=ON
        -D CMAKE_INSTALL_PREFIX=install

    - name: Build
      run: cmake --build . -- -j$(nproc)

    - name: Run components tests
      run: ./components-tests

    - name: Run OpenMW tests
      run: ./openmw-tests

    - name: Run OpenMW-CS tests
      run: ./openmw-cs-tests

    # - name: Install
    #   shell: bash
    #   run: cmake --install .

    # - name: Create Artifact
    #   shell: bash
    #   working-directory: install
    #   run: |
    #     ls -laR
    #     7z a ../build_artifact.7z .

    # - name: Upload Artifact
    #   uses: actions/upload-artifact@v1
    #   with:
    #     path: ./build_artifact.7z
    #     name: build_artifact.7z

  Vulkan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Add OpenMW PPA Dependencies
      run: sudo add-apt-repository ppa:openmw/openmw; sudo apt-get update

    - name: Install Building and Vulkan Dependencies
      run: >
        sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic
        && sudo apt-get install -y binutils libvulkan-dev glslang-tools mesa-vulkan-drivers
        vulkan-validationlayers xvfb

    - name: Configure Vulkan migration build
      run: >
        cmake -S . -B build-vulkan
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=ON
        -D USE_SYSTEM_TINYXML=ON
        -D OPENMW_USE_VULKAN=ON
        -D BUILD_VULKAN_TESTS=ON

    - name: Build Vulkan migration targets
      run: cmake --build build-vulkan --target openmw openmw-vulkan-smoke openmw-vulkan-math-tests openmw-render-neutral-tests openmw-render-world-tests openmw-render-mesh-tests openmw-vulkan-image-tests openmw-vulkan-terrain-tests -- -j$(nproc)

    - name: Verify renderer link isolation
      run: |
        if rg -n '#include[[:space:]]*[<"]osg|namespace[[:space:]]+osg|osg::|Nif::|Log::' components/vk components/render; then
          echo "renderer-neutral and Vulkan source boundaries must not depend on OSG, NIF, or shared logging"
          exit 1
        fi
        if rg -n '#include[[:space:]]*[<"]osg|namespace[[:space:]]+osg|osg::' components/terrain/renderstorage.hpp components/terrain/renderstorage.cpp; then
          echo "renderer-neutral terrain storage must not depend on OSG"
          exit 1
        fi
        if rg -n '#include[[:space:]]*[<"]osg|namespace[[:space:]]+osg|osg::' apps/openmw/mwworld/positioncellgrid.hpp; then
          echo "terrain preload transport must not depend on OSG math types"
          exit 1
        fi
        if rg -n '#include[[:space:]]*[<"]osgViewer/(Viewer|ViewerEventHandlers)' apps/openmw/engine.hpp; then
          echo "the engine public header must not import complete OSG viewer headers"
          exit 1
        fi
        if rg -n 'mWorldScene\.(record|remove|update|set|clear)' apps/openmw/mwrender/renderingmanager.cpp; then
          echo "RenderingManager must not mutate the renderer-neutral world scene; world lifecycle owns those writes"
          exit 1
        fi
        if rg -n 'Render::WorldScene[[:space:]]+mWorldScene|getNeutralWorldScene' apps/openmw/mwrender/renderingmanager.hpp apps/openmw/mwrender/renderingmanager.cpp; then
          echo "RenderingManager must not own or expose the renderer-neutral world scene"
          exit 1
        fi
        if rg -n 'Render::SceneData[[:space:]]+mNeutralSceneData' apps/openmw/mwrender/renderingmanager.hpp; then
          echo "RenderingManager must not own the renderer-neutral frame state"
          exit 1
        fi
        if rg -n 'RenderingInterface|renderinginterface\.hpp' apps/openmw; then
          echo "The removed renderer object-insertion adapter must not return"
          exit 1
        fi
        if rg -n '(^|[[:space:]])renderinginterface([[:space:]]|$)' apps/openmw/CMakeLists.txt; then
          echo "The deleted renderer object-insertion source must not remain in build lists"
          exit 1
        fi
        if rg -n -U 'insertObjectRendering\([^;{}]*(RenderingManager|RenderingInterface)' \
            apps/openmw/mwclass apps/openmw/mwworld --glob '*.cpp' --glob '*.hpp'; then
          echo "Object-class insertion must depend directly on MWRender::Objects"
          exit 1
        fi
        if rg -n 'mNeutralSceneData|setNeutralSceneData|clearNeutralSceneData|synchronizeNeutralScene' \
            apps/openmw/mwrender/renderingmanager.hpp apps/openmw/mwrender/renderingmanager.cpp; then
          echo "RenderingManager must not mutate or retain a back-pointer into the world-owned neutral frame state"
          exit 1
        fi
        if rg -n 'MWRender::TerrainStorage' apps/openmw/mwworld/scene.hpp apps/openmw/mwworld/scene.cpp; then
          echo "World scene must depend on the neutral terrain storage contract"
          exit 1
        fi
        if rg -n 'TerrainStorage&[[:space:]]+getTerrainStorage' apps/openmw/mwrender/renderingmanager.hpp; then
          echo "RenderingManager must expose the neutral terrain storage contract"
          exit 1
        fi
        if rg -n 'getResourceSystem\(|getWorkQueue\(|getLandManager\(|getLightRoot\(|getSkyManager\(|getTerrain\(|getIncrementalCompileOperation\(' \
            apps/openmw/mwrender/renderingmanager.hpp; then
          echo "RenderingManager must not expose general game-service gateways"
          exit 1
        fi
        if rg -n 'pagingUnlockCache|getPagedRefnums' \
            apps/openmw/mwrender/renderingmanager.hpp apps/openmw/mwrender/renderingmanager.cpp; then
          echo "RenderingManager must not expose object-paging service gateways"
          exit 1
        fi
        if rg -n 'getNeutralScene\(' apps/openmw/mwrender/renderingmanager.hpp apps/openmw/mwrender/renderingmanager.cpp; then
          echo "RenderingManager must not assemble renderer-neutral scene submissions"
          exit 1
        fi
        if rg -n 'getRenderTile\(|Render::TerrainTile' apps/openmw/mwrender/renderingmanager.cpp; then
          echo "RenderingManager must not assemble renderer-neutral terrain snapshots"
          exit 1
        fi
        if rg -n 'mRendering\.getResourceSystem\(\)' apps/openmw/mwworld/scene.cpp; then
          echo "Scene neutral/resource paths must not use RenderingManager as their resource gateway"
          exit 1
        fi
        if rg -n 'getAnimation\(|getNeutralBoneMatrices\(' apps/openmw/mwworld/scene.cpp; then
          echo "Scene neutral state and bone poses must use injected renderer providers"
          exit 1
        fi
        if rg -n 'getNeutralWorldScene' apps/openmw --glob '*.cpp' --glob '*.hpp'; then
          echo "OpenMW production code must use Scene neutral-state APIs instead of exposing WorldScene ownership"
          exit 1
        fi
        if rg -n 'eventTraversal\(\)|updateTraversal\(\)|renderingTraversals\(\)' apps/openmw --glob '*.cpp' --glob '*.hpp' \
            | rg -v 'apps/openmw/mwrender/renderingmanager.cpp|apps/openmw/mwrender/viewerframelifecycle.cpp'; then
          echo "OpenMW frame traversal must go through an explicit renderer owner boundary"
          exit 1
        fi
        if rg -n 'mViewer->advance\(' apps/openmw --glob '*.cpp' --glob '*.hpp' \
            | rg -v 'apps/openmw/mwrender/renderingmanager.cpp|apps/openmw/mwrender/viewerframelifecycle.cpp'; then
          echo "OpenMW frame advancement must go through an explicit renderer owner boundary"
          exit 1
        fi
        if rg -n 'new[[:space:]]+osgViewer::Viewer' apps/openmw --glob '*.cpp' --glob '*.hpp' \
            | rg -v 'apps/openmw/mwrender/viewerframelifecycle.cpp'; then
          echo "The OSG viewer must be created only by its renderer-specific lifecycle owner"
          exit 1
        fi
        if rg -n 'mRendering->(renderFrame|advanceFrame)\(' apps/openmw/mwworld/worldimp.cpp; then
          echo "World frame traversal must go through the renderer-neutral frame lifecycle"
          exit 1
        fi
        if rg -n 'mRendering\.getTerrainStorage\(\)' apps/openmw/mwworld/scene.cpp; then
          echo "Scene neutral terrain paths must use their injected RenderStorage contract"
          exit 1
        fi
        if rg -n 'class RenderingManager[^\n]*Render::FrameLifecycle|RenderingManager[^\n]*FrameLifecycle' \
            apps/openmw/mwrender/renderingmanager.hpp; then
          echo "RenderingManager must not inherit the renderer-neutral frame lifecycle"
          exit 1
        fi
        if rg -n 'Render::FrameLifecycle|FrameLifecycle' \
            apps/openmw/mwrender/renderingmanager.hpp apps/openmw/mwrender/renderingmanager.cpp; then
          echo "RenderingManager must not retain the active renderer frame lifecycle"
          exit 1
        fi
        if rg -n 'getFrameLifecycle|make_unique<[^>]*FrameLifecycle' \
            apps/openmw/mwrender/renderingmanager.hpp apps/openmw/mwrender/renderingmanager.cpp; then
          echo "The renderer manager must not create or expose a duplicate frame lifecycle"
          exit 1
        fi
        frame_lifecycle_count=$(rg -n 'make_unique<[^>]*FrameLifecycle' apps/openmw/engine.cpp | wc -l)
        if [ "$frame_lifecycle_count" -ne 1 ]; then
          echo "The engine must construct exactly one renderer frame lifecycle"
          exit 1
        fi
        if rg -n 'make_unique<[^>]*FrameLifecycle' apps/openmw --glob '*.cpp' --glob '*.hpp' \
            | rg -v 'apps/openmw/engine.cpp'; then
          echo "No OpenMW production file other than the engine may construct a frame lifecycle"
          exit 1
        fi
        if readelf -d build-vulkan/openmw | grep -Eiq 'libvulkan|libOpenSceneGraph|libosg'; then
          echo "openmw must not carry Vulkan or OSG runtime dependencies in the isolated build"
          exit 1
        fi
        if ! readelf -d build-vulkan/openmw-vulkan-smoke | grep -q 'libvulkan'; then
          echo "openmw-vulkan-smoke must carry the Vulkan runtime dependency"
          exit 1
        fi
        if readelf -d build-vulkan/openmw-vulkan-smoke | grep -Eiq 'libOpenSceneGraph|libosg'; then
          echo "openmw-vulkan-smoke must not carry OSG runtime dependencies"
          exit 1
        fi
        if nm -C build-vulkan/openmw-vulkan-smoke | grep -Eiq 'osgViewer::|osgAnimation::|osgParticle::|osgShadow::|osgDB::|osgUtil::|osgGA::|osgSim::|osgText::'; then
          echo "openmw-vulkan-smoke must not contain OSG renderer implementation symbols"
          exit 1
        fi
        if nm -C build-vulkan/openmw-vulkan-smoke | grep -Eiq 'osg::|Nif::|(^| )Log::'; then
          echo "openmw-vulkan-smoke must not contain legacy OSG, NIF, or shared logging symbols"
          exit 1
        fi
        if readelf -d build-vulkan/openmw-render-neutral-tests | grep -Eiq 'libOpenSceneGraph|libosg'; then
          echo "renderer-neutral mesh tests must not carry OSG runtime dependencies"
          exit 1
        fi
        if nm -C build-vulkan/openmw-render-neutral-tests | grep -Eiq 'osg::|Nif::|(^| )Log::'; then
          echo "renderer-neutral mesh tests must not contain legacy OSG, NIF, or shared logging symbols"
          exit 1
        fi

    - name: Run Vulkan CPU and neutral tests
      run: >
        xvfb-run -a
        ctest --test-dir build-vulkan --output-on-failure
        -R 'openmw-(vulkan-(math-tests|image-tests|terrain-tests)|render-(neutral|world|mesh)-tests)'

    - name: Run Vulkan presentation smoke
      run: >
        xvfb-run -a
        env SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1
        ./build-vulkan/openmw-vulkan-smoke
        ./build-vulkan/resources/shaders/vulkan 3

    - name: Run Vulkan headless lifecycle probe
      run: |
        set +e
        env OPENMW_VULKAN_HEADLESS=1 ./build-vulkan/openmw-vulkan-smoke ./build-vulkan/resources/shaders/vulkan 3
        status=$?
        if [ "$status" -ne 0 ] && [ "$status" -ne 77 ]; then
          exit "$status"
        fi

  MacOS:
    strategy:
      fail-fast: true
      matrix:
        args:
          - image: macos-15
          - image: macos-15-intel
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.args.image }}

  Windows:
    strategy:
      fail-fast: true
      matrix:
        image:
        - "2022"

    uses: ./.github/workflows/windows.yml
    with:
      image: ${{ matrix.image }}
